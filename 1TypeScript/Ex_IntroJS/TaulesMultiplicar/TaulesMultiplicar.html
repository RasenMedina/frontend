<!doctype html>
<html lang="ca">
    <head>
        <title>Taules de multiplicar</title>
        <meta charset="UTF-8" />
        <style>
            body { font-family: Arial, Helvetica, sans-serif; }
            /* Estils per donar format a les taules individuals */
            table { border-collapse: collapse; }
            .taula-individual { border: 1px solid black; margin: 5px; display: inline-block; vertical-align: top; }
            .taula-individual td { border: 1px solid black; padding: 3px 8px; text-align: center; }
            .taula-individual th { background-color: #eee; border: 1px solid black; padding: 4px; }
            strong { color: #0000FF; }
        </style>

        <!-- Importem el fitxer JavaScript extern. 
             L'atribut 'defer' assegura que el script s'executa un cop el HTML s'ha carregat completament -->
        <script defer src="TaulesMultiplicar.js"></script>
    </head>

    <!-- L'atribut onload="mostrar()" executa la funció automàticament en carregar la pàgina -->
    <body onload="mostrar()">
        <h3>Taules de multiplicar</h3>
        Start <input type="number" id="start" min="0" max="100" step="1" value="1">&nbsp;&nbsp;&nbsp;
        Stop <input type="number" id="stop" min="0" max="100" step="1" value="10">&nbsp;&nbsp;&nbsp;
        N.col <input type="number" id="ncol" min="1" max="10" step="1" value="10">&nbsp;&nbsp;&nbsp;
        <input type="button" value="Mostrar" onclick="mostrar()"><br><br>
        
        <!-- Contenidor on s'injectaran les taules generades pel JavaScript -->
        <div id="tm"></div>
    </body>
</html>
