<!doctype html>
<html lang="ca">
	<head>
		<title>Lletres</title>
		<meta charset="UTF-8" />

		<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=RYNjtdpnpapyh_7iUeyYuIUnsb7L7t9BTsMKnqHAuHPWTUZLZ_iezXQLmP_hvtKN3Ow977DeXW15FX1q5H6AYryb_oX5Ke1n2HMvw6_J99kegohAdjKlNjNrXZ1buGTwHXHvZymLF6-r2IWgdUWhpg" charset="UTF-8"></script><style>
			h4{margin-top:1.5em;margin-bottom:0.3em;}
			button{width:1.8em;height:1.8em;margin-top:3px;margin-bottom:3px;}
			div{vertical-align:middle;display:inline-block;height:2em;margin-top:4px;border:1px solid black;background-color:#e0e0e0;overflow-x:auto;}
		</style>

		<script defer src="Lletres.js"></script>
		
		<script>
			function _transliterar() {
				let f = document.getElementById('frase').value;
				let r = transliterar(f);
				if (r != undefined) document.getElementById('processada').value = r;
			}

			function _separar() {
				let f = document.getElementById('frase').value;
				let sep = document.getElementById('separador').value;
				let r = separar(f, sep);
				if (r != undefined) document.getElementById('processada').value = r;
			}
		</script>
	</head>

	<body>
		<strong>Escriu una frase</strong><br>
		<textarea id="frase" cols="50" rows="5"></textarea><br>
		<textarea id="processada" cols="50" rows="5" disabled></textarea>
		<h4>Transliterar</h4>
			Eliminar accents i dièresis de les vocals.<br>
			<button style="width:8em" onclick="_transliterar()">Transliterar</button>
		<h4>Separar</h4>
			Separar la frase en trossos més petits.<br>
			Cal indicar quin o quins caràcters marquen els punts de tall.<br>
			<input style="margin-top:4px;margin-bottom:4px;width:3em;" type="text" id="separador"> 
			<button style="width:8em" onclick="_separar()">Separar</button>
	</body>
</html>
